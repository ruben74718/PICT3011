<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attack Tree Template</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">Attack Tree Template</h1>
        
        <div class="tree-container">
            <!-- Top Node (Parent) -->
            <div class="node top-node">
                <p><strong>Root Node:</strong> Threat actor intending to gain notoriety, by causing embarrassment to the local government and inconvenience to drivers.</p>
            </div>
            
            <!-- Connecting Lines Container -->
            <svg class="connection-lines" preserveAspectRatio="none" viewBox="0 0 100 60">
                <!-- Left line -->
                <line x1="30" y1="0" x2="30" y2="30" stroke="black" stroke-width="2"/>
                <line x1="30" y1="30" x2="10" y2="30" stroke="black" stroke-width="2"/>
                <line x1="10" y1="30" x2="10" y2="60" stroke="black" stroke-width="2"/>
                
                <!-- Right line -->
                <line x1="70" y1="0" x2="70" y2="30" stroke="black" stroke-width="2"/>
                <line x1="70" y1="30" x2="90" y2="30" stroke="black" stroke-width="2"/>
                <line x1="90" y1="30" x2="90" y2="60" stroke="black" stroke-width="2"/>
            </svg>
            
            <!-- Bottom Nodes (Children) -->
            <div class="nodes-row">
                <div class="node left-node">
                    <p>Sub-Attack 1</p>
                </div>
                <div class="node right-node">
                    <p>Sub-Attack 2</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
